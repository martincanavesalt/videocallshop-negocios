name: Recordatorios de reuniones

on:
  schedule:
    # Todos los días a las 10:00 de Argentina (13:00 UTC)
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha de las reuniones a recordar (AAAA-MM-DD). Vacío = mañana"
        required: false
      dry_run:
        description: "Solo probar, sin enviar mails (1 = sí)"
        required: false
        default: "0"

jobs:
  enviar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/recordatorios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node enviar.mjs
        env:
          SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FECHA: ${{ github.event.inputs.fecha }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
